<!--
    Magento_Checkout::billing-address.html (2.4.9), shown ONLY when the delivery address can't be used for billing,
    i.e. a cart of virtual products only (no delivery address). Otherwise nothing is shown: the billing address is
    always the delivery address (user decision 2026-10-26; Magento's checkout-data-resolver copies it).
    Selected by js/mixin/billing-address-mixin.js. Re-check against the core template on Magento upgrades.
-->
<!-- ko ifnot: canUseShippingAddress() -->
<div class="checkout-billing-address">
    <div class="bsspeedy-billing-title"><span data-bind="i18n: 'Invoice details'"></span></div>
    <render args="detailsTemplate"></render>
    <fieldset class="fieldset" data-bind="visible: !isAddressDetailsVisible()">
        <each args="getRegion('billing-address-list')" render=""></each>
        <div data-bind="fadeVisible: isAddressFormVisible">
            <render args="formTemplate"></render>
        </div>
        <render args="actionsTemplate"></render>
    </fieldset>
</div>
<!-- /ko -->
